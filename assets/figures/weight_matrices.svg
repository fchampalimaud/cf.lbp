<svg xmlns="http://www.w3.org/2000/svg" width="620" height="260" viewBox="0 0 620 260">
  <rect width="620" height="260" fill="#f5f0ea"/>

  <!-- ── Panel 1: Avoidance / One-to-one (same-side diagonal) ── -->
  <text x="160" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="bold" fill="#3a2e28">Avoidance</text>
  <text x="160" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-style="italic" fill="#7a6050">One-to-one</text>

  <!-- active Sensor L -> Motor L -->
  <rect x="95" y="65" width="64" height="64" rx="4" fill="#c4d8f0" stroke="#3A6FA8" stroke-width="1.5"/>
  <text x="127" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e4a7a">1</text>
  <!-- inactive Sensor R -> Motor L -->
  <rect x="162" y="65" width="64" height="64" rx="4" fill="#f5f0ea" stroke="#ddd5c8" stroke-width="1.5"/>
  <text x="194" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#c8bfb2">0</text>
  <!-- inactive Sensor L -> Motor R -->
  <rect x="95" y="132" width="64" height="64" rx="4" fill="#f5f0ea" stroke="#ddd5c8" stroke-width="1.5"/>
  <text x="127" y="169" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#c8bfb2">0</text>
  <!-- active Sensor R -> Motor R -->
  <rect x="162" y="132" width="64" height="64" rx="4" fill="#c4d8f0" stroke="#3A6FA8" stroke-width="1.5"/>
  <text x="194" y="169" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e4a7a">1</text>

  <text x="87" y="101" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a2e28">→ Motor L</text>
  <text x="87" y="168" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a2e28">→ Motor R</text>
  <text x="127" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a2e28">Sensor L</text>
  <text x="194" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a2e28">Sensor R</text>

  <!-- ── Panel 2: Attraction / Manual, crossed ── -->
  <text x="460" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="bold" fill="#3a2e28">Attraction</text>
  <text x="460" y="48" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-style="italic" fill="#7a6050">Manual, crossed</text>

  <!-- inactive Sensor L -> Motor L -->
  <rect x="395" y="65" width="64" height="64" rx="4" fill="#f5f0ea" stroke="#ddd5c8" stroke-width="1.5"/>
  <text x="427" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#c8bfb2">0</text>
  <!-- active Sensor R -> Motor L -->
  <rect x="462" y="65" width="64" height="64" rx="4" fill="#c4d8f0" stroke="#3A6FA8" stroke-width="1.5"/>
  <text x="494" y="102" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e4a7a">1</text>
  <!-- active Sensor L -> Motor R -->
  <rect x="395" y="132" width="64" height="64" rx="4" fill="#c4d8f0" stroke="#3A6FA8" stroke-width="1.5"/>
  <text x="427" y="169" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="bold" fill="#1e4a7a">1</text>
  <!-- inactive Sensor R -> Motor R -->
  <rect x="462" y="132" width="64" height="64" rx="4" fill="#f5f0ea" stroke="#ddd5c8" stroke-width="1.5"/>
  <text x="494" y="169" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="18" fill="#c8bfb2">0</text>

  <text x="387" y="101" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a2e28">→ Motor L</text>
  <text x="387" y="168" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a2e28">→ Motor R</text>
  <text x="427" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a2e28">Sensor L</text>
  <text x="494" y="215" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#3a2e28">Sensor R</text>
</svg>
