    <text x="10" y="85" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d4cac0">Arena:</text>
    <circle cx="110" cy="81" r="6" fill="#2e2820" stroke="#5a4a3a" stroke-width="1.2"/>
