    <rect x="164" y="104" width="30" height="28" rx="5" fill="#88ccee" stroke="#4888aa" stroke-width="1"/>
    <text x="179" y="123" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#0e3a58">C</text>
    <rect x="198" y="104" width="30" height="28" rx="5" fill="#eeee66" stroke="#a8a820" stroke-width="1"/>
    <text x="213" y="123" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#484800">D</text>
    <rect x="232" y="104" width="30" height="28" rx="5" fill="#ee88cc" stroke="#b04888" stroke-width="1"/>
