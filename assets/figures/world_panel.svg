<svg xmlns="http://www.w3.org/2000/svg" width="520" height="254" viewBox="0 0 520 254">

  <!-- Border — no fill so the page background shows through -->
  <rect width="520" height="254" rx="8" fill="none" stroke="#5a4a3a" stroke-width="1.5"/>

  <!-- Content shifted right 51px (to center 398px block in 520px) and down 5px (18px top margin) -->
  <g transform="translate(51, 5)">

    <!-- ── Row 1: Trail ── -->
    <rect x="10" y="13" width="14" height="14" rx="2" fill="#2e2820" stroke="#5a4a3a" stroke-width="1.2"/>
    <polyline points="12,20 15,24 22,15" fill="none" stroke="#9a6840" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="30" y="25" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d4cac0">Trail</text>
    <text x="148" y="25" font-family="Inter,Arial,sans-serif" font-size="11" fill="#907060">Len:</text>
    <rect x="186" y="11" width="96" height="20" rx="3" fill="#2e2820" stroke="#5a4a3a" stroke-width="1"/>
    <text x="198" y="25" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d4cac0">1000</text>
    <rect x="276" y="11" width="6" height="20" rx="1" fill="#3a3028" stroke="#5a4a3a" stroke-width="0.5"/>

    <!-- ── Row 2: 3D ── -->
    <rect x="10" y="43" width="14" height="14" rx="2" fill="#2e2820" stroke="#5a4a3a" stroke-width="1.2"/>
