    <rect x="266" y="104" width="30" height="28" rx="5" fill="#66dddd" stroke="#308888" stroke-width="1"/>
    <text x="281" y="123" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#004848">F</text>
    <rect x="302" y="104" width="52" height="28" rx="4" fill="#2e2820" stroke="#5a4a3a" stroke-width="1"/>
    <text x="328" y="123" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d4cac0">Cont.</text>
    <rect x="360" y="104" width="48" height="28" rx="4" fill="#2e2820" stroke="#5a4a3a" stroke-width="1"/>
    <text x="384" y="123" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d4cac0">Wall</text>

    <!-- ── Row 5: Objects ── -->
    <text x="10" y="155" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d4cac0">Objects:</text>
    <rect x="96" y="140" width="30" height="28" rx="5" fill="#dd3333" stroke="#aa1818" stroke-width="1"/>
    <text x="111" y="159" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="white">Z</text>
    <rect x="130" y="140" width="30" height="28" rx="5" fill="#229922" stroke="#147014" stroke-width="1"/>
    <text x="145" y="159" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="white">Y</text>
    <rect x="164" y="140" width="30" height="28" rx="5" fill="#3355cc" stroke="#1a30a8" stroke-width="1"/>
    <text x="179" y="159" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="white">X</text>
    <rect x="198" y="140" width="30" height="28" rx="5" fill="#ccaa11" stroke="#988000" stroke-width="1"/>
    <text x="213" y="159" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="white">W</text>
    <rect x="232" y="140" width="30" height="28" rx="5" fill="#cc6611" stroke="#994400" stroke-width="1"/>
    <text x="247" y="159" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="white">V</text>
    <rect x="266" y="140" width="30" height="28" rx="5" fill="#882299" stroke="#601070" stroke-width="1"/>
    <text x="281" y="159" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="white">U</text>
    <rect x="302" y="140" width="106" height="28" rx="4" fill="#5c4a3a" stroke="#3a2e28" stroke-width="1"/>
    <text x="355" y="159" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#f5f0ea">Solid</text>

    <!-- ── Row 6: Sky ── -->
    <text x="10" y="191" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d4cac0">Sky:</text>
    <rect x="42" y="178" width="14" height="14" rx="2" fill="#2e2820" stroke="#5a4a3a" stroke-width="1"/>
    <text x="62" y="191" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d4cac0">Polarization field</text>
    <rect x="200" y="178" width="28" height="20" rx="3" fill="#2e2820" stroke="#5a4a3a" stroke-width="1"/>
    <text x="214" y="192" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#d4cac0">↕</text>

    <!-- Title centered on the content block (x=209 → x=260 after +51 transform) -->
    <text x="209" y="214" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#d4cac0">World panel</text>
    <text x="209" y="228" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#907060" font-style="italic">trail · arena · gradients · objects · sky</text>

