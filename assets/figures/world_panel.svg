    <text x="30" y="55" font-family="Inter,Arial,sans-serif" font-size="11" fill="#d4cac0">3D (MuJoCo)</text>
    <rect x="148" y="41" width="72" height="22" rx="4" fill="#2e2820" stroke="#5a4a3a" stroke-width="1"/>
    <text x="184" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d4cac0">Show 3D</text>
    <rect x="226" y="41" width="72" height="22" rx="4" fill="#3a3028" stroke="#6a5a48" stroke-width="1"/>
    <text x="262" y="56" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" fill="#d4cac0">Top view</text>

