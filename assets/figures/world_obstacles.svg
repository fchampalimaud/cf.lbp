<svg xmlns="http://www.w3.org/2000/svg" width="380" height="195" viewBox="0 0 380 195">
  <rect width="380" height="195" rx="8" fill="#f5f0ea"/>
  <line x1="190" y1="0" x2="190" y2="195" stroke="#d4cfc8" stroke-width="1"/>

  <!-- Panel 1: Solid obstacle -->
  <!-- Obstacle circle (brownish-gray, solid) -->
  <circle cx="70" cy="83" r="48" fill="#c8b8a8" fill-opacity="0.55" stroke="#9a8070" stroke-width="1.5"/>
  <!-- Robot to the right, outside obstacle -->
  <circle cx="145" cy="83" r="18" fill="#e2d8cc" stroke="#5c4a3a" stroke-width="1.5"/>
  <polygon points="145,65 139.9,90.4 150.1,90.4" fill="#5c4a3a" fill-opacity="0.35"/>
  <!-- Repulsion arrow pointing right (away from obstacle) -->
  <line x1="164" y1="83" x2="180" y2="83" stroke="#b84040" stroke-width="1.5"/>
  <line x1="174" y1="77" x2="180" y2="83" stroke="#b84040" stroke-width="1.5"/>
  <line x1="174" y1="89" x2="180" y2="83" stroke="#b84040" stroke-width="1.5"/>
  <text x="95" y="163" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#3a2e28">Solid obstacle</text>
  <text x="95" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a6050" font-style="italic">blocks and repels the robot</text>

  <!-- Panel 2: Room (circular confinement) -->
  <!-- Room boundary ring -->
  <circle cx="285" cy="83" r="65" fill="none" stroke="#9a8070" stroke-width="12" stroke-opacity="0.18"/>
  <circle cx="285" cy="83" r="65" fill="none" stroke="#9a8070" stroke-width="1.5"/>
  <!-- Robot inside, near the top boundary -->
  <circle cx="285" cy="33" r="18" fill="#e2d8cc" stroke="#5c4a3a" stroke-width="1.5"/>
  <polygon points="285,15 279.9,40.4 290.1,40.4" fill="#5c4a3a" fill-opacity="0.35"/>
  <!-- Confinement arrow pointing inward (downward toward center) -->
  <line x1="285" y1="51" x2="285" y2="66" stroke="#b84040" stroke-width="1.5"/>
  <line x1="279" y1="60" x2="285" y2="66" stroke="#b84040" stroke-width="1.5"/>
  <line x1="291" y1="60" x2="285" y2="66" stroke="#b84040" stroke-width="1.5"/>
  <text x="285" y="163" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#3a2e28">Room</text>
  <text x="285" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a6050" font-style="italic">confines the robot inside</text>
</svg>
