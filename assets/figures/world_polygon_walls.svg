<svg xmlns="http://www.w3.org/2000/svg" width="380" height="195" viewBox="0 0 380 195">
  <rect width="380" height="195" rx="8" fill="#f5f0ea"/>
  <line x1="190" y1="0" x2="190" y2="195" stroke="#d4cfc8" stroke-width="1"/>

  <!-- Panel 1: Solid polygon -->
  <polygon points="38,24 152,24 95,142" fill="#9a8070" fill-opacity="0.28" stroke="#9a8070" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Robot outside (to the right) -->
  <circle cx="168" cy="83" r="15" fill="#e2d8cc" stroke="#5c4a3a" stroke-width="1.5"/>
  <polygon points="168,68 163.4,90.4 172.6,90.4" fill="#5c4a3a" fill-opacity="0.35"/>
  <text x="95" y="163" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#3a2e28">Solid polygon</text>
  <text x="95" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a6050" font-style="italic">robot stays outside</text>

  <!-- Panel 2: Room polygon -->
  <!-- Thick-band hollow polygon (room boundary style) -->
  <polygon points="228,24 342,24 285,142" fill="#9a8070" fill-opacity="0.05" stroke="#9a8070" stroke-width="10" stroke-opacity="0.18" stroke-linejoin="round"/>
  <polygon points="228,24 342,24 285,142" fill="none" stroke="#9a8070" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Robot inside -->
  <circle cx="285" cy="88" r="15" fill="#e2d8cc" stroke="#5c4a3a" stroke-width="1.5"/>
  <polygon points="285,73 280.4,95.4 289.6,95.4" fill="#5c4a3a" fill-opacity="0.35"/>
  <text x="285" y="163" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#3a2e28">Room polygon</text>
  <text x="285" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a6050" font-style="italic">robot stays inside</text>
</svg>
