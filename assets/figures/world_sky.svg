<svg xmlns="http://www.w3.org/2000/svg" width="280" height="195" viewBox="0 0 280 195">
  <rect width="280" height="195" rx="8" fill="#f5f0ea"/>

  <!-- E-vector bars (tilted at sky.angle = 30° from horizontal) -->
  <!-- Each bar: 20px long, dx=±8.66, dy=±5 -->
  <!-- Col x: 44, 99, 154, 209 | Row y: 52, 97, 142 -->
  <!-- Row 1, y=52 -->
  <line x1="35.3" y1="57" x2="52.7" y2="47" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="90.3" y1="57" x2="107.7" y2="47" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="145.3" y1="57" x2="162.7" y2="47" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="200.3" y1="57" x2="217.7" y2="47" stroke="#9a8070" stroke-width="1.8"/>
  <!-- Row 2, y=97 -->
  <line x1="35.3" y1="102" x2="52.7" y2="92" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="90.3" y1="102" x2="107.7" y2="92" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="145.3" y1="102" x2="162.7" y2="92" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="200.3" y1="102" x2="217.7" y2="92" stroke="#9a8070" stroke-width="1.8"/>
  <!-- Row 3, y=142 -->
  <line x1="35.3" y1="147" x2="52.7" y2="137" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="90.3" y1="147" x2="107.7" y2="137" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="145.3" y1="147" x2="162.7" y2="137" stroke="#9a8070" stroke-width="1.8"/>
  <line x1="200.3" y1="147" x2="217.7" y2="137" stroke="#9a8070" stroke-width="1.8"/>

  <!-- Sun (top-right, perpendicular to e-vectors = 30°+90°=120° direction = lower-left) -->
  <circle cx="244" cy="38" r="11" fill="#f5c842" stroke="#e8b020" stroke-width="1.2"/>
  <line x1="244" y1="22" x2="244" y2="17" stroke="#e8b020" stroke-width="1.2"/>
  <line x1="255" y1="27" x2="259" y2="23" stroke="#e8b020" stroke-width="1.2"/>
  <line x1="260" y1="38" x2="265" y2="38" stroke="#e8b020" stroke-width="1.2"/>
  <line x1="255" y1="49" x2="259" y2="53" stroke="#e8b020" stroke-width="1.2"/>
  <line x1="233" y1="27" x2="229" y2="23" stroke="#e8b020" stroke-width="1.2"/>
  <line x1="228" y1="38" x2="223" y2="38" stroke="#e8b020" stroke-width="1.2"/>

  <!-- Sun direction dashed arrow (from center toward sun = upper-right) -->
  <line x1="128" y1="97" x2="229" y2="47" stroke="#e8b020" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- Arrowhead at upper-right end -->
  <line x1="217" y1="39" x2="229" y2="47" stroke="#e8b020" stroke-width="1.2"/>
  <line x1="222" y1="57" x2="229" y2="47" stroke="#e8b020" stroke-width="1.2"/>
  <text x="190" y="75" font-family="Inter,Arial,sans-serif" font-size="8" fill="#b08020">sun dir</text>

  <!-- e-vector angle label -->
  <text x="8" y="30" font-family="Inter,Arial,sans-serif" font-size="8" fill="#9a8070">sky.angle</text>
  <!-- Small angle arc at top-left to illustrate the angle -->
  <path d="M 25,38 A 14,14 0 0 1 39,32" fill="none" stroke="#9a8070" stroke-width="1"/>
  <line x1="25" y1="24" x2="25" y2="44" stroke="#9a8070" stroke-width="0.8" stroke-dasharray="2,2"/>

  <text x="140" y="163" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#3a2e28">Sky polarization</text>
  <text x="140" y="177" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="9" fill="#7a6050" font-style="italic">e-vector bars + sun direction</text>
</svg>
