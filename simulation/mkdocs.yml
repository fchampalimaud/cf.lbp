site_name: Little Brain Project Simulator
site_description: Build and run neural-circuit behaviours on a simulated robot

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true

nav:
  - Home:
    - Overview: index.md
    - Install: simulator/install.md
    - Simulator: simulator/tour.md
    - Architecture: simulator/architecture.md
  - Creating Worlds: simulator/creating-worlds.md
  - Coding Brains: simulator/coding-brains.md
  - Wiring Brains:
    - Introduction: simulator/wiring-brains.md
    - Sensor types:
      - Overview: simulator/sensors/index.md
      - GradientSensor: simulator/sensors/gradient.md
      - ColorSensor: simulator/sensors/color.md
      - CollisionSensor: simulator/sensors/collision.md
      - DistanceSensor: simulator/sensors/distance.md
      - InteroceptiveSensor: simulator/sensors/interoceptive.md
      - ProprioceptiveSensor: simulator/sensors/proprioceptive.md
      - WhiskerSensor: simulator/sensors/whisker.md
      - SkyCompassSensor: simulator/sensors/skycompass.md
      - GrayCameraSensor: simulator/sensors/graycamera.md
      - RGBCameraSensor: simulator/sensors/rgbcamera.md
    - Neuron types:
      - SumLayer: simulator/layers/sum.md
      - MotorLayer: simulator/layers/motor.md
      - ConstantLayer: simulator/layers/constant.md
      - LeakyLayer: simulator/layers/leaky.md
      - AdaptiveLayer: simulator/layers/adaptive.md
      - PulseLayer: simulator/layers/pulse.md
      - SineLayer: simulator/layers/sine.md
      - RingAttractorLayer: simulator/layers/ring_attractor.md
      - Conv2dLayer: simulator/layers/conv2d.md
      - Leaky2dLayer: simulator/layers/leaky2d.md
      - Reichardt2dLayer: simulator/layers/reichardt2d.md
      - TDLayer: simulator/layers/td.md
      - DeltaLayer: simulator/layers/delta.md
      - ThreeFactorLayer: simulator/layers/three_factor.md
      - MatsuokaLayer: simulator/layers/matsuoka.md
  # - Real Robot: simulator/real-robot.md

extra_css:
  - extra.css

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

docs_dir: docs
site_dir: site
