{% extends "base.html" %}

{% block scripts %}
{{ super() }}
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var markup =
      '<span class="lbp-title-project">little brain project</span>' +
      '<span class="lbp-title-sim">SIMULATOR</span>';
    document.querySelectorAll(
      ".md-header__title .md-header__topic .md-ellipsis"
    ).forEach(function (el) {
      el.innerHTML = markup;
    });
  });
</script>
{% endblock %}
